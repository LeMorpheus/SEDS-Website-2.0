    .pixel-text {
  font-family: 'Pixelify Sans', sans-serif;

  white-space: nowrap;       
         
  text-overflow: ellipsis;

.pixel-text-subtitle {
 font-family: 'Pixelify Sans', sans-serif;

  font-size: 50px;
  white-space: nowrap;

}
.pixel-text-moto {
 font-family: 'Pixelify Sans', sans-serif;
  font-weight: 100; 
  font-style: normal;
  font-size: 40px;
  white-space: nowrap;       
         
  text-overflow: ellipsis;
 

  background: linear-gradient(90deg, #FFDE47, #FF856B); /* customize colors */
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  color: transparent;
  margin-top: 15px;
}
  
/* Media query for small screens like phones */
@media (max-width: 600px) {
  .pixel-text {
    font-size: 70px; /* reduced from 100px */
    margin-left: 330px; /* center instead of pushing right */
    white-space: normal; /* allow wrapping */
    display: block;
    margin-bottom: 10px;
  }


  .pixel-text-subtitle {
    font-size: 14px; /* reduced from 50px */
    margin-left: 330px;
    margin-bottom: 15px;
  }

  .pixel-text-moto {
    font-size: 33px; /* reduced from 40px */
    margin-left: 330px;
  }
}

    

/* Aviral star bg */
.starfield {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
  z-index: -1;
}

.star {
  position: absolute;
  width: 2.2px;
  height: 2.2px;
  background: white;
  border-radius: 50%;
  opacity: 0.8;
  animation: moveStar linear infinite;
  box-shadow: 0 0 6px 2px white;
  animation-delay: 0s;
}

/* Random motion animation */
@keyframes moveStar {
  0% {
    transform: translateY(0) translateX(0);
    opacity: 0;  /* fully transparent at spawn */
  }
  10% {
    opacity: 1;  /* fade in quickly */
  }
  100% {
    transform: translateY(-100vh) translateX(50vw);
    opacity: 0;  /* fade out at the end */
  }
}

    <script>
  const starfield = document.querySelector('.starfield');

  const colors = ['white',  '#3D3DFF', '#CC9EFF'];

  for (let i = 0; i < 500; i++) {
    const star = document.createElement('div');
    star.classList.add('star');
    
    const color = colors[Math.floor(Math.random() * colors.length)];
    
    star.style.top = Math.random() * 100 + 'vh';
    star.style.left = Math.random() * 100 + 'vw';
    star.style.animationDuration = (5 + Math.random() * 4) + 's';
    star.style.animationDelay = Math.random() * 5 + 's';
    star.style.background = color;
    star.style.boxShadow = `0 0 6px 2px ${color}`;
    
    starfield.appendChild(star);
  } 
</script>
